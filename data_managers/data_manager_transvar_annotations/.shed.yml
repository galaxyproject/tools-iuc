name: data_manager_transvar_annotations
owner: iuc
description: "Download the transcript annotation databases used by TransVar"
homepage_url: https://github.com/zwdzwd/transvar
long_description: |
    TransVar annotates genomic, cDNA and protein variants against one or more
    transcript sets. This data manager downloads the pre-built transcript
    annotation databases published by the TransVar authors into a Galaxy
    managed data directory and registers them in the transvar_annotations
    data table, so that the TransVar tool does not depend on databases being
    written into the installed Python package directory.

    Only annotation sets that are openly licensed and freely redistributable
    are offered: RefSeq, CCDS, Ensembl, GENCODE and the UCSC RefGene and
    knownGene tables.
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/data_managers/data_manager_transvar_annotations
type: unrestricted
categories:
- Data Managers
