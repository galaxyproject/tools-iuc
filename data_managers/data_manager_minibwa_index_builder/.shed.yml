description: minibwa is a fast successor to BWA-MEM for short and accurate long reads.
homepage_url: https://github.com/lh3/minibwa
long_description: |
  minibwa aligns short reads and accurate long reads to a reference genome. It
  combines the variable-length seeding of BWA-MEM with the chaining and base-level
  alignment of minimap2, and additionally supports Hi-C reads and directional
  bisulfite sequencing reads. This data manager builds the minibwa reference index
  and registers it in the minibwa_indexes tool data table.
name: data_manager_minibwa_index_builder
owner: iuc
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/data_managers/data_manager_minibwa_index_builder
type: unrestricted
