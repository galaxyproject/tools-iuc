name: data_manager_humann_database_downloader
owner: iuc
description: "Reference data (ChocoPhlAn, UniRef, utility mappings) for HUMAnN, for functional profiling of metagenomes and metatranscriptomes"
homepage_url: http://huttenhower.sph.harvard.edu/humann
long_description: |
    Downloads the reference data HUMAnN needs: the ChocoPhlAn pangenome catalog (nucleotide
    search), UniRef protein clusters (translated search) and the utility mapping files
    (regrouping and renaming HUMAnN features).

    The data manager records the versioned name of the upstream artifact in the data table
    value (e.g. `full_chocophlan.v201901_v31`, `uniref90_annotated_v201901b_full`,
    `full_mapping_v201901b`) instead of an installation date, so that the same data has the
    same identity on every Galaxy instance and in serialized workflows. These data
    generations are identical for every HUMAnN release from 3.1.1 to 3.9.
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/data_managers/data_manager_humann_database_downloader
type: unrestricted
categories:
- Data Managers