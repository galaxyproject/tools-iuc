description: BWA-MEM3 is a short-read aligner derived from BWA-MEM2 with correctness fixes and performance improvements.
homepage_url: https://github.com/fg-labs/bwa-mem3
long_description: |
  BWA-MEM3 is a short-read aligner derived from BWA-MEM2 with correctness fixes,
  performance improvements, methylation-aware alignment and a multi-tier SIMD
  runtime. On non-methylation data at default settings it reproduces the
  alignments of BWA-MEM/BWA-MEM2 while running faster. This data manager builds
  the BWA-MEM3 reference index and registers it in the bwa_mem3_indexes tool
  data table.
