name: PR Review Submitted

# Unprivileged trigger only: on fork PRs this run gets a read-only token and no secrets.
# The completed run triggers the workflow_run job in ready-for-review.yaml, which removes the label.
on:
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  notify:
    # ready-for-review.yaml skips this check-run name in its CI gate; keep them in sync.
    name: PR Review Submitted (trigger)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "Review submitted"
