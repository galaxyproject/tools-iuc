name: Auto-Label Ready for Review

on:
  issue_comment:
    types: [created]
  # Reviews on fork PRs only get a read-only token, so the unprivileged
  # "PR Review Submitted" workflow fires on the review and this one does the write.
  workflow_run:
    workflows: [PR Review Submitted]
    types: [completed]

permissions: {}

jobs:
  check-and-label:
    if: |
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, 'please review')) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request_review')
    # Job-level so skipped runs (every other comment) never enter the queue and cancel a pending one.
    # shortcut: the comment and review paths of one PR use different keys (the PR number isn't known
    # here for workflow_run), so they can still race; a later review or "please review" corrects it.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate App Token (repo-scoped)
        id: repo-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write

      - name: Check PR Status and Apply Label
        id: check-pr
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.repo-token.outputs.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.issue.number;

            // 1. Fetch PR details
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });

            if (pr.draft) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body: `⏸️ This PR is still a draft. Please mark it as ready for review before requesting a review.`
              });
              console.log("PR is a draft. Skipping.");
              return;
            }

            // 2. Check for unresolved review threads
            const query = `
              query($owner: String!, $repo: String!, $pull_number: Int!, $cursor: String) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $pull_number) {
                    reviewThreads(first: 100, after: $cursor) {
                      nodes { isResolved }
                      pageInfo { hasNextPage endCursor }
                    }
                  }
                }
              }
            `;

            let cursor = null;
            let hasUnresolved = false;
            let hasNextPage = false;
            do {
              const result = await github.graphql(query, { owner, repo, pull_number, cursor });
              const { nodes, pageInfo } = result.repository.pullRequest.reviewThreads;
              if (nodes.some(t => !t.isResolved)) {
                hasUnresolved = true;
                break;
              }
              cursor = pageInfo.endCursor;
              hasNextPage = pageInfo.hasNextPage;
            } while (hasNextPage);

            if (hasUnresolved) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body: `💬 There are unresolved review comments on this PR. Please resolve them before requesting a review.`
              });
              console.log("Unresolved review comments exist. Skipping.");
              return;
            }

            // 3. Check CI - exclude this workflow's own run
            const { data: checkRunsData } = await github.rest.checks.listForRef({
              owner,
              repo,
              ref: pr.head.sha,
              per_page: 100,
            });

            const relevant = checkRunsData.check_runs.filter(r =>
              r.name !== context.workflow &&
              // the review trigger stub runs on every review, including thread replies
              r.name !== 'PR Review Submitted (trigger)'
            );

            // No check runs yet → not ready
            if (relevant.length === 0) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body: `⏳ No CI checks have reported for this PR yet. Please wait for CI to run and then try again.`
              });
              console.log("No check runs found. Skipping.");
              return;
            }

            // Any check still running → not ready
            const hasIncomplete = relevant.some(r => r.status !== 'completed');
            if (hasIncomplete) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body: `⏳ Some CI checks are still running. Please wait for them to complete before requesting a review.`
              });
              console.log("Some CI checks are still running. Skipping.");
              return;
            }

            // Any check failed → report and stop
            const failing = relevant.filter(r =>
              r.conclusion !== 'success' &&
              r.conclusion !== 'skipped' &&
              r.conclusion !== 'neutral'
            );
            if (failing.length > 0) {
              const lines = failing
                .map(r => `- **${r.name}**: ${r.conclusion} → [view](${r.html_url})`)
                .join('\n');
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body: `❌ Please check the CI errors before requesting a review.\n\nFailing checks:\n\n${lines}\n\n[View full CI summary](https://github.com/${owner}/${repo}/pull/${pull_number}/checks)`
              });
              return;
            }

            // 4. All good - add the label
            const alreadyLabeled = pr.labels.some(l => l.name === 'ready-for-review');
            console.log("All checks passed. Adding 'ready-for-review' label.");
            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: pull_number,
              labels: ['ready-for-review']
            });
            core.setOutput('status', 'Needs Review');
            core.setOutput('pr-node-id', pr.node_id);

            // 5. Ping everyone who reviewed before (not the author, commenter or bots),
            // once per review round: repeating "please review" must not re-ping.
            if (alreadyLabeled) return;
            try {
              const reviews = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number });
              const skip = [pr.user.login, context.payload.comment.user.login];
              const reviewers = [...new Set(reviews
                .filter(r => r.user && r.user.type !== 'Bot' && !skip.includes(r.user.login))
                .map(r => r.user.login))];
              if (reviewers.length > 0) {
                // Must not contain the trigger phrase, or this comment re-runs the workflow.
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pull_number,
                  body: `🔔 ${reviewers.map(u => '@' + u).join(' ')}: the contributor has addressed the earlier feedback and asked for another look.`
                });
              }
            } catch (e) {
              // The label is already on; a failed ping must not skip the board update.
              core.warning(`Could not ping previous reviewers: ${e.message}`);
            }

      - name: Remove Label After a Review
        id: check-review
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.repo-token.outputs.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const run = context.payload.workflow_run;

            // For fork PRs, workflow_run.pull_requests is empty, head_repository is the base repo and
            // /commits/{sha}/pulls returns nothing, so match the head SHA among recently updated open PRs.
            // The PR was just reviewed, so it is at the top of this list.
            // shortcut: a push landing between the review and this run changes the SHA and the review is
            // missed; the next review or "please review" corrects it.
            // Nothing from the unprivileged run is trusted beyond this lookup; everything is re-checked below.
            const { data: prs } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              sort: 'updated',
              direction: 'desc',
              per_page: 100,
            });
            const pr = prs.find(p => p.head.sha === run.head_sha);
            if (!pr) { console.log(`No open PR found with head ${run.head_sha}.`); return; }
            if (!pr.labels.some(l => l.name === 'ready-for-review')) {
              console.log(`PR #${pr.number} is not labeled. Skipping.`);
              return;
            }

            // Only reviews submitted after the label was (last) added count,
            // otherwise an old review would strip the label right after "please review".
            const events = await github.paginate(github.rest.issues.listEvents, {
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            const labeledAt = events
              .filter(e => e.event === 'labeled' && e.label?.name === 'ready-for-review')
              .map(e => e.created_at)
              .pop();

            // The author replying in a review thread also creates a COMMENTED review, so exclude them.
            // Only reviews from repo members/collaborators count, so a drive-by review can't pull a PR from the queue.
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner, repo, pull_number: pr.number,
            });
            const review = reviews.filter(r =>
              r.user && r.user.type !== 'Bot' && r.user.login !== pr.user.login &&
              ['MEMBER', 'OWNER', 'COLLABORATOR'].includes(r.author_association) &&
              r.state !== 'PENDING' && (!labeledAt || r.submitted_at > labeledAt)
            ).pop();
            if (!review) { console.log(`No new non-author review on PR #${pr.number}. Skipping.`); return; }

            console.log(`PR #${pr.number} reviewed by ${review.user.login} (${review.state}). Removing 'ready-for-review' label.`);
            try {
              await github.rest.issues.removeLabel({
                owner, repo, issue_number: pr.number, name: 'ready-for-review',
              });
            } catch (e) {
              // Already removed (by hand or by a parallel run): nothing left to do.
              if (e.status === 404) { console.log('Label already removed.'); return; }
              throw e;
            }
            // An approved PR waits on a maintainer to merge, not on the contributor: keep its board status.
            if (review.state === 'APPROVED') return;
            core.setOutput('status', 'In progress');
            core.setOutput('pr-node-id', pr.node_id);

      - name: Generate App Token (project-scoped)
        if: steps.check-pr.outputs.status || steps.check-review.outputs.status
        id: project-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-organization-projects: write

      - name: Update PR Status on Project Board
        if: steps.check-pr.outputs.status || steps.check-review.outputs.status
        uses: actions/github-script@v9
        env:
          STATUS: ${{ steps.check-pr.outputs.status || steps.check-review.outputs.status }}
          PR_NODE_ID: ${{ steps.check-pr.outputs.pr-node-id || steps.check-review.outputs.pr-node-id }}
        with:
          github-token: ${{ steps.project-token.outputs.token }}
          script: |
            const org = 'galaxyproject';
            const projectNumber = 81;

            // Get project metadata
            const { organization } = await github.graphql(`
              query($org: String!, $number: Int!) {
                organization(login: $org) {
                  projectV2(number: $number) {
                    id
                    fields(first: 20) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options { id name }
                        }
                      }
                    }
                  }
                }
              }
            `, { org, number: projectNumber });

            const project = organization.projectV2;
            const statusField = project.fields.nodes.find(f => f.name === 'Status');
            const option = statusField.options.find(o => o.name === process.env.STATUS);

            // Find the PR's item ID on the project board
            const prNodeId = process.env.PR_NODE_ID;
            const { node } = await github.graphql(`
              query($id: ID!) {
                node(id: $id) {
                  ... on PullRequest {
                    projectItems(first: 10) {
                      nodes {
                        id
                        project { id }
                      }
                    }
                  }
                }
              }
            `, { id: prNodeId });

            const item = node.projectItems.nodes.find(i => i.project.id === project.id);
            if (!item) { console.log('PR not found on project board'); return; }

            // Update status
            await github.graphql(`
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId
                  itemId: $itemId
                  fieldId: $fieldId
                  value: { singleSelectOptionId: $optionId }
                }) { projectV2Item { id } }
              }
            `, {
              projectId: project.id,
              itemId: item.id,
              fieldId: statusField.id,
              optionId: option.id
            });

            console.log(`PR moved to "${process.env.STATUS}".`);
