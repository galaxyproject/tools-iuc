---
# Daily rebuild + deploy of the IUC website to GitHub Pages.
# Also runs on pushes touching website/.
name: Website

on:
  push:
    branches: [main, website]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  schedule:
    - cron: "17 3 * * *"  # daily at 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "website"
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for the git-history stats analyzer

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: website/astro/package.json

      # Cache the rse-content checkout (blobless clone of
      # research-software-ecosystem/content, used for EDAM expansion).
      - name: Cache rse-content checkout
        uses: actions/cache@v4
        with:
          path: website/.rse-content
          key: rse-content-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            rse-content-${{ runner.os }}-

      # Cache the uv venv. Galaxy packages are installed from git as deps,
      # so the cache avoids re-building them on every run. Keyed by
      # pyproject.toml hash so dep changes bust the cache.
      - name: Cache uv venv
        uses: actions/cache@v4
        with:
          path: website/.venv
          key: venv-${{ runner.os }}-${{ hashFiles('website/pyproject.toml') }}
          restore-keys: |
            venv-${{ runner.os }}-

      # Cache generated data for scheduled rebuilds at the same commit. The
      # pipeline validates cache freshness before reusing expensive outputs.
      - name: Cache generated data
        uses: actions/cache@v4
        with:
          path: |
            website/data
            website/tool_source_store.sqlite
          key: website-data-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            website-data-${{ runner.os }}-

      - name: Install pipeline deps
        working-directory: website
        run: uv sync

      - name: Install site deps
        working-directory: website/astro
        run: npm ci

      - name: Extract data
        working-directory: website
        run: |
          uv run python -m pipeline.build_tool_conf
          uv run python -m pipeline.extract_tools
          uv run python -m pipeline.extract_toolshed
          uv run python -m pipeline.extract_tool_availability
          uv run python -m pipeline.extract_stats
          uv run python -m pipeline.extract_people
          uv run python -m pipeline.extract_releases

      - name: Upload generated data
        uses: actions/upload-artifact@v4
        with:
          name: website-data
          path: website/data
          retention-days: 7

      - name: Build site
        working-directory: website/astro
        run: npx astro build

      - name: Build search index
        working-directory: website/astro
        run: npx pagefind --site dist

      - name: Check internal links
        working-directory: website/astro
        run: npx astro preview --host 127.0.0.1 --port 4325 --strictPort & pid=$!; sleep 5; PORT=4325 npm run links:internal; status=$?; kill $pid 2>/dev/null || true; wait $pid 2>/dev/null || true; exit $status

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/astro/dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  # Commit the regenerated data/ to the gh-pages branch for auditability.
  commit-data:
    runs-on: ubuntu-latest
    needs: build-deploy
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download generated data
        uses: actions/download-artifact@v4
        with:
          name: website-data
          path: website/data
      - name: Commit data to gh-pages
        run: |
          git checkout --orphan gh-pages-temp
          git rm -rf . 2>/dev/null || true
          cp -r website/data ./data
          git add data
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" commit -m "data: regenerate $(date -u +%Y-%m-%d)"
          git push origin HEAD:gh-pages --force
