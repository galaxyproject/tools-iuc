---
# Daily rebuild + deploy of the IUC website to GitHub Pages.
# Also runs on pushes touching website/.
name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  schedule:
    - cron: "17 3 * * *"  # daily at 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "website-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEPLOY_PAGES: >-
    ${{
      github.repository == 'galaxyproject/tools-iuc' && github.ref == 'refs/heads/main'
    }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0  # full history for the git-history stats analyzer

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: website/astro/package.json

      # Cache the rse-content checkout (blobless clone of
      # research-software-ecosystem/content, used for EDAM expansion).
      - name: Restore rse-content checkout
        id: rse-cache
        uses: actions/cache/restore@v4
        with:
          path: website/.rse-content
          key: rse-content-${{ runner.os }}-v1
          restore-keys: |
            rse-content-${{ runner.os }}-

      # Cache the uv venv. Galaxy packages are installed from git as deps,
      # so the cache avoids re-building them on every run. Keyed by
      # pyproject.toml hash so dep changes bust the cache.
      - name: Restore uv venv
        id: venv-cache
        uses: actions/cache/restore@v4
        with:
          path: website/.venv
          key: venv-${{ runner.os }}-${{ hashFiles('website/pyproject.toml') }}
          restore-keys: |
            venv-${{ runner.os }}-

      # Cache generated data for scheduled rebuilds at the same commit. The
      # pipeline validates cache freshness before reusing expensive outputs.
      - name: Restore generated data
        id: data-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            website/data
            website/tool_source_store.sqlite
          key: website-data-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            website-data-${{ runner.os }}-

      - name: Install pipeline deps
        working-directory: website
        run: uv sync

      - name: Install site deps
        working-directory: website/astro
        run: npm ci

      - name: Validate source
        working-directory: website
        run: bash check.sh

      # This cache is independent of generated metadata and template changes.
      - name: Restore history index
        id: history-cache
        uses: actions/cache/restore@v4
        with:
          path: website/.history-cache/history.sqlite
          key: iuc-history-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            iuc-history-v1-${{ runner.os }}-${{ github.sha }}-
            iuc-history-v1-${{ runner.os }}-

      - name: Update history index
        id: history-index
        working-directory: website
        run: uv run python -m pipeline.history_index

      # Save the completed index even if a later website build fails.
      - name: Save history index
        if: env.DEPLOY_PAGES == 'true' && steps.history-index.outputs.changed == 'true' && steps.history-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: website/.history-cache/history.sqlite
          key: iuc-history-v1-${{ runner.os }}-${{ github.sha }}

      - name: Extract data
        working-directory: website
        run: |
          uv run python -m pipeline.build_tool_conf
          uv run python -m pipeline.extract_tools
          uv run python -m pipeline.extract_toolshed
          uv run python -m pipeline.extract_tool_availability
          uv run python -m pipeline.extract_stats
          uv run python -m pipeline.extract_people
          uv run python -m pipeline.extract_releases

      - name: Save rse-content checkout
        if: env.DEPLOY_PAGES == 'true' && steps.rse-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: website/.rse-content
          key: ${{ steps.rse-cache.outputs.cache-primary-key }}

      - name: Save uv venv
        if: env.DEPLOY_PAGES == 'true' && steps.venv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: website/.venv
          key: ${{ steps.venv-cache.outputs.cache-primary-key }}

      - name: Save generated data
        if: env.DEPLOY_PAGES == 'true' && steps.data-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            website/data
            website/tool_source_store.sqlite
          key: ${{ steps.data-cache.outputs.cache-primary-key }}

      - name: Upload generated data
        uses: actions/upload-artifact@v4
        with:
          name: website-data
          path: website/data
          retention-days: 7

      - name: Build site
        working-directory: website/astro
        run: npx astro build

      - name: Build search index
        working-directory: website/astro
        run: npx pagefind --site dist

      - name: Check internal links
        working-directory: website/astro
        run: npx astro preview --host 127.0.0.1 --port 4325 --strictPort & pid=$!; sleep 5; PORT=4325 npm run links:internal; status=$?; kill $pid 2>/dev/null || true; wait $pid 2>/dev/null || true; exit $status

      - name: Install browser
        working-directory: website/astro
        run: npx playwright install --with-deps chromium

      - name: Check browser search
        working-directory: website/astro
        run: npm run test:browser

      - name: Upload artifact
        if: env.DEPLOY_PAGES == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/astro/dist

  deploy-pages:
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    if: github.repository == 'galaxyproject/tools-iuc' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
