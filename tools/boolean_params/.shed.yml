categories:
- Text Manipulation
description: Compute, combine and invert boolean parameters for workflow conditions
long_description: |
  Expression tools that produce boolean parameters for Galaxy workflows, for
  use as `when` conditions of conditional steps or as boolean tool inputs.
  Invert a boolean (NOT), combine several booleans (AND, OR, NAND, NOR, XOR,
  exactly one, all equal), and compare a text, integer or float value to get a
  boolean. Unset (null) inputs are handled explicitly: fail, or treat as
  false or true.
homepage_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/boolean_params
name: boolean_params
owner: iuc
