name: savont
owner: iuc
description: Savont tools for long-read amplicon sequence variant (ASV) generation and taxonomic profiling
long_description: |
    Savont turns >~98% accuracy long-read amplicon sequences (ONT R10.4.1 or PacBio HiFi) into
    amplicon sequence variants (ASVs) at single-nucleotide resolution, and profiles their taxonomy
    against reference databases (EMU, SILVA, GreenGenes2, UNITE).
    See https://github.com/bluenote-1577/savont for details.
categories:
- Metagenomics
- Sequencing
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/savont
homepage_url: https://github.com/bluenote-1577/savont
type: unrestricted
auto_tool_repositories:
  name_template: "{{ tool_id }}"
  description_template: "Wrapper for savont {{ tool_name }}."
suite:
  name: "suite_savont"
  description: "A suite of tools that brings the Savont project into Galaxy."
  long_description: |
      Savont generates amplicon sequence variants (ASVs) from high-accuracy long-read amplicon
      sequencing (ONT R10.4.1 or PacBio HiFi) and profiles their taxonomy against reference
      databases. The suite provides ASV detection (savont asv), alignment-based classification
      (savont classify), genus-level SINTAX classification (savont sintax) and merging of several
      samples into QIIME2-compatible files (savont export). A data manager installs the Savont
      reference databases (EMU, SILVA, GreenGenes2, UNITE).
