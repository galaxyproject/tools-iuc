categories:
- Assembly
- Metagenomics
description: High-resolution metagenome assembly with noisy long reads (Nanopore R10, PacBio HiFi)
long_description: |
  myloasm is a de novo metagenome assembler for Nanopore R10 and PacBio HiFi
  long reads. It uses polymorphic k-mers in a string-graph framework to resolve
  closely related strains and produce complete, often circular, contigs.
name: myloasm
owner: iuc
