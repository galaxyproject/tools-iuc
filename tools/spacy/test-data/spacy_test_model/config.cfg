[paths]
train = null
dev = null
vectors = null
init_tok2vec = null

[system]
seed = 0
gpu_allocator = null

[nlp]
lang = "en"
pipeline = ["tagger", "morphologizer", "parser", "entity_ruler", "lemmatizer"]
disabled = []
before_creation = null
after_creation = null
after_pipeline_creation = null
batch_size = 1000

[corpora]

[training]
seed = ${system.seed}
gpu_allocator = ${system.gpu_allocator}
dropout = 0.1
accumulate_gradient = 1
patience = 1600
max_epochs = 0
max_steps = 20000
eval_frequency = 200
frozen_components = []
annotating_components = []
dev_corpus = "corpora.dev"
train_corpus = "corpora.train"
before_to_disk = null
before_update = null

[initialize]
vectors = ${paths.vectors}
init_tok2vec = ${paths.init_tok2vec}
vocab_data = null
lookups = null
before_init = null
after_init = null

[components]

[pretraining]

[nlp.tokenizer]
@tokenizers = "spacy.Tokenizer.v1"

[nlp.vectors]
@vectors = "spacy.Vectors.v1"

[corpora.train]
@readers = "spacy.Corpus.v1"
path = ${paths.train}
gold_preproc = false
max_length = 0
limit = 0
augmenter = null

[corpora.dev]
@readers = "spacy.Corpus.v1"
path = ${paths.dev}
gold_preproc = false
max_length = 0
limit = 0
augmenter = null

[training.logger]
@loggers = "spacy.ConsoleLogger.v1"
progress_bar = false

[training.batcher]
@batchers = "spacy.batch_by_words.v1"
discard_oversize = false
tolerance = 0.2
get_length = null

[training.optimizer]
@optimizers = "Adam.v1"
beta1 = 0.9
beta2 = 0.999
L2_is_weight_decay = true
L2 = 0.01
grad_clip = 1.0
use_averages = false
eps = 1e-08
learn_rate = 0.001

[training.score_weights]
tag_acc = 0.11
pos_acc = 0.06
tag_micro_p = null
tag_micro_r = null
tag_micro_f = null
morph_acc = 0.06
morph_per_feat = null
dep_uas = 0.06
dep_las = 0.06
dep_las_per_type = null
sents_p = null
sents_r = null
sents_f = 0.0
ents_f = 0.33
ents_p = 0.0
ents_r = 0.0
ents_per_type = null
lemma_acc = 0.33

[initialize.tokenizer]

[initialize.components]

[components.tagger]
factory = "tagger"
overwrite = false
neg_prefix = "!"
label_smoothing = 0.0

[components.morphologizer]
factory = "morphologizer"
overwrite = true
extend = false
label_smoothing = 0.0

[components.parser]
factory = "parser"
min_action_freq = 1
moves = null
update_with_oracle_cut_size = 100
learn_tokens = false

[components.entity_ruler]
factory = "entity_ruler"
phrase_matcher_attr = null
validate = false
overwrite_ents = false
ent_id_sep = "||"

[components.lemmatizer]
factory = "lemmatizer"
mode = "lookup"
model = null
overwrite = false

[training.batcher.size]
@schedules = "compounding.v1"
start = 100
stop = 1000
compound = 1.001
t = 0.0

[components.tagger.model]
@architectures = "spacy.Tagger.v2"
nO = null
normalize = false

[components.tagger.scorer]
@scorers = "spacy.tagger_scorer.v1"

[components.morphologizer.model]
@architectures = "spacy.Tagger.v2"
nO = null
normalize = false

[components.morphologizer.scorer]
@scorers = "spacy.morphologizer_scorer.v1"

[components.parser.model]
@architectures = "spacy.TransitionBasedParser.v2"
state_type = "parser"
extra_state_tokens = false
hidden_width = 8
maxout_pieces = 2
use_upper = true
nO = null

[components.parser.scorer]
@scorers = "spacy.parser_scorer.v1"

[components.entity_ruler.matcher_fuzzy_compare]
@misc = "spacy.levenshtein_compare.v1"

[components.entity_ruler.scorer]
@scorers = "spacy.entity_ruler_scorer.v1"

[components.lemmatizer.scorer]
@scorers = "spacy.lemmatizer_scorer.v1"

[components.tagger.model.tok2vec]
@architectures = "spacy.HashEmbedCNN.v2"
width = 8
depth = 2
embed_size = 500
window_size = 1
maxout_pieces = 2
subword_features = true
pretrained_vectors = null

[components.morphologizer.model.tok2vec]
@architectures = "spacy.HashEmbedCNN.v2"
width = 8
depth = 2
embed_size = 500
window_size = 1
maxout_pieces = 2
subword_features = true
pretrained_vectors = null

[components.parser.model.tok2vec]
@architectures = "spacy.HashEmbedCNN.v2"
width = 8
depth = 2
embed_size = 500
window_size = 1
maxout_pieces = 2
subword_features = true
pretrained_vectors = null