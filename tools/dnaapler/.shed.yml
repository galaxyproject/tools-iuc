description: Reorient circular microbial sequences
homepage_url: https://github.com/gbouras13/dnaapler
long_description: |
  DNAapler reorients assembled microbial chromosomes, plasmids, phages,
  and other circular sequences using marker proteins or predicted coding
  sequences. The wrapper accepts FASTA and GFA1 assemblies.
