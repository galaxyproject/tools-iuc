name: bambu
owner: iuc
description: Transcript discovery and quantification from long-read RNA-seq
long_description: |
  Bambu discovers novel transcripts and quantifies known and novel isoforms from long-read
  RNA-seq alignments (Oxford Nanopore or PacBio, aligned with minimap2 in spliced mode). It
  extends a reference annotation with high-confidence novel transcripts, using a model that
  ranks candidates by the novel discovery rate (NDR), and estimates transcript and gene
  expression with an EM algorithm that separates full-length and partial read support.
categories:
- Transcriptomics
- RNA
homepage_url: https://bioconductor.org/packages/bambu
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/bambu
type: unrestricted
