name: pyeuk_typing
owner: iuc
description: PyEuk — portable multilocus typing and outbreak stratification for amplicon sequencing
long_description: |
  PyEuk turns amplicon reads into a specimen-by-haplotype sheet and stratifies specimens
  with a weighted identity-by-state distance and a cluster sweep, without a curated allele
  catalogue. The suite covers the whole path: derive an amplicon panel from reads when none
  is available (derive-panel), choose analysis windows from the reads (define-windows), call
  read-level window haplotypes (call-haplotypes), assemble the sheet (build-sheet), and
  compute distances and the cluster sweep (cluster).
homepage_url: https://github.com/spond/pyeuk
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/pyeuk_typing
categories:
  - Sequence Analysis
  - Metagenomics
  - Phylogenetics
auto_tool_repositories:
  name_template: "{{ tool_id }}"
  description_template: "PyEuk: {{ tool_name }}"
suite:
  name: suite_pyeuk_typing
  description: PyEuk portable multilocus typing and outbreak stratification
