description: Post-clustering curation of OTU or ASV tables (LULU algorithm)
homepage_url: https://github.com/frederic-mahe/mumu
long_description: |
  mumu is a C++ implementation of LULU, an algorithm for post-clustering curation
  of metabarcoding data. It merges OTUs or ASVs that are probably errors of a more
  abundant, similar and co-occurring OTU or ASV into that parent.
name: mumu
owner: iuc
