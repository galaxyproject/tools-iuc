categories:
- Spatial Omics
description: Spatial gene expression prediction, calibration, and downstream analysis with TISSUE
long_description: |
  TISSUE predicts unmeasured spatial gene expression from a single-cell RNA-seq
  reference using SpaGE, Harmony-kNN, or Tangram, computes cell-centric variability, and calibrates
  conformal prediction intervals using cross-validated measured genes.
  Downstream analyses include multiple-imputation hypothesis testing,
  uncertainty-weighted PCA, uncertain-cell detection, and filtered PCA.
