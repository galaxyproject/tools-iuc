categories:
- Spatial Omics
description: Uncertainty-calibrated spatial gene expression prediction with TISSUE
long_description: |
  TISSUE predicts unmeasured spatial gene expression from a single-cell RNA-seq
  reference using SpaGE, computes cell-centric variability, and calibrates
  conformal prediction intervals using cross-validated measured genes.
