categories:
- Text Manipulation
- Convert Formats
description: Convert fixed-width text columns to tabular
long_description: |
    fixed2tab converts fixed-width column text into tabular data. It detects the column
    boundaries automatically, by locating character positions that are blank in
    every record.

    Legacy scientific programs often write their results as fixed-width columns,
    which delimiter-based tools cannot read: cells that contain spaces break
    apart, and blank cells shift later fields to the left.

    Every run writes the table, a geometry report and every unconverted line,
    so that table rows plus rejected lines always equal the input lines.
