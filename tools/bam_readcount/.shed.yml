name: bam_readcount
owner: iuc
description: >
  BAM Readcount generates low-level metrics at single nucleotide positions from a
  BAM or CRAM file, including base counts, mapping/base qualities, strandedness,
  and mismatch statistics. Originally designed to help filter genomic mutation calls.
homepage_url: https://github.com/genome/bam-readcount
long_description: |
  BAM Readcount generates low-level metrics at single nucleotide positions
  from a BAM or CRAM file. Outputs include observed bases, read counts,
  summarized mapping and base qualities, strandedness information, mismatch
  counts, and position within the reads.

  Originally designed to help filter genomic mutation calls, the metrics are
  also useful as input for variant detection tools and for resolving ambiguity
  between variant callers.
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/bam_readcount
type: unrestricted
categories:
  - Sequence Analysis
  - Variant Analysis
