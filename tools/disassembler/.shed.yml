name: disassembler
owner: iuc
homepage_url: https://github.com/nekrut/disassembler
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/disassembler
description: Reconstruct coding haplotypes from planetary sequence indexes (Logan, kmindex, LexicMap)
long_description: |
  disassembler reconstructs in-frame coding haplotypes of a target gene across many SRA runs,
  starting from planetary-scale indexes of the Logan assemblies. The kmindex route harvests
  candidate accessions from a kmindex query, optionally stratifies them by score, and walks each
  accession's Logan unitig graph into a haplotype with intra-host variants. The LexicMap route
  tiles LexicMap hits against Logan contigs into a codon-checked cohort. Both routes can thin
  near-duplicates with a k-mer diversity sieve and end in a reference-guided codon alignment and
  a FastTree phylogeny.
categories:
  - Sequence Analysis
  - Phylogenetics
  - Variant Analysis
type: unrestricted
auto_tool_repositories:
  name_template: "{{ tool_id }}"
  description_template: "Wrapper for the disassembler tool: {{ tool_name }}."
suite:
  name: "suite_disassembler"
  description: "Reconstruct coding haplotypes from Logan unitigs and contigs, then align and build a tree."
  type: repository_suite_definition
