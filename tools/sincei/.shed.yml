categories:
- Sequence Analysis
- Single Cell
description: "sincei: a user-friendly toolkit for single-cell analysis of sequencing data"
long_description: |
    sincei is a suite of command-line tools for the analysis of single-cell sequencing data,
    covering barcode detection and filtering, per-cell QC statistics, read counting over bins or
    features, count-matrix quality control and merging, dimensionality reduction and clustering,
    feature scoring, detection of variable chromatin regions, export, region plots, and
    pseudo-bulk coverage generation.
name: sincei
owner: iuc
homepage_url: https://github.com/bhardwaj-lab/sincei
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/sincei
type: unrestricted
auto_tool_repositories:
  name_template: "{{ tool_id }}"
  description_template: "Wrapper for the sincei tool suite: {{ tool_name }}"
suite:
  name: "suite_sincei"
  description: "A suite of Galaxy tools for single-cell sequencing analysis with sincei."
  long_description: |
    sincei is a suite of command-line tools for the analysis of single-cell sequencing data,
