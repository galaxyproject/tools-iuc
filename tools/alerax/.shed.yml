name: alerax
owner: iuc
description: "Species tree inference and gene tree reconciliation under duplication, transfer and loss"
homepage_url: https://github.com/BenoitMorel/AleRax
long_description: |
  AleRax infers reconciled gene trees together with a shared species tree,
  using a probabilistic model of gene duplication, transfer and loss.
  For each gene family it takes a sample of gene trees (e.g. from MrBayes or PhyloBayes).
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/alerax
type: unrestricted
categories:
- Phylogenetics

