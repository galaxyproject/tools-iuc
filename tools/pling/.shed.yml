owner: iuc
name: pling
description: Cluster related plasmids using Pling
long_description: |
  Pling clusters related plasmids using containment distance and DCJ-Indel
  rearrangement distance. This wrapper exposes the ``pling cluster align``
  command in Galaxy.
categories:
  - Sequence Analysis
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/pling
homepage_url: https://github.com/iqbal-lab-org/pling
type: unrestricted
auto_tool_repositories:
  name_template: "{{ tool_id }}"
  description_template: "{{ tool_name }} from the Pling plasmid clustering suite"
suite:
  name: suite_pling
  description: Galaxy suite for Pling plasmid clustering tools
  long_description: |
    Pling clusters related plasmids using containment distance and DCJ-Indel
    rearrangement distance.
