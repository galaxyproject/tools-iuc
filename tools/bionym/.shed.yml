categories:
- Genomics
description: Resolve a gene identifier into a confidence-scored knowledge graph
homepage_url: https://github.com/d-callan/bionym
long_description: |
  BioNym gathers evidence for a gene identifier (any species) from public
  APIs — NCBI, VEuPathDB, OMA, UniProt, KEGG — and asks a typed-question
  judge (TypeSafe JEV or any POST /v1/systemone-compatible backend) an
  ordered workflow of questions to produce a confidence-scored knowledge
  graph with evidence provenance on every edge. Outputs the graph as JSON
  and optionally a self-contained HTML report.
name: bionym
owner: iuc
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/bionym
type: unrestricted
