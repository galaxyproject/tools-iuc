name: genomecov_coverage_table
owner: iuc
description: Tabulate percent genome coverage from bedtools genomecov histograms
long_description: |
  Combines bedtools genomecov histograms into one table, with one row per
  sample and one labelled column per input collection. Each value is the
  percent of the genome covered at or above a minimum depth.
