owner: iuc

name: idr_download_by_ids
description: Fetch images and annotations from IDR or OMERO

long_description: |
  The Image Data Resource (IDR) is a public repository of image datasets
  from published scientific studies.

  This tool allows users to fetch images and annotations directly from IDR
  or from an OMERO server. Annotations include tables and key-value pairs.

  Zarr files are provided as links to their S3 or HTTPS storage locations,
  together with an NGFF validation link. Other image formats are downloaded
  as original files, up to a maximum of 20 files. If more files are selected,
  only links are provided.

  OMERO images can be exported as single-plane, stack, or full hypercube TIFF
  files, or downloaded as their original files.

categories:
  - Imaging
  - Data Source

homepage_url: https://idr.openmicroscopy.org

remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/idr_download

type: unrestricted
