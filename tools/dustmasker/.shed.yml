name: dustmasker
owner: iuc
description: Mask low-complexity DNA with NCBI BLAST+ DustMasker
long_description: |
  DustMasker finds low-complexity regions in nucleotide sequences with the
  symmetric DUST algorithm. The tool writes the regions as BED or as raw
  intervals, or it writes the input as a soft-masked FASTA.
homepage_url: https://www.ncbi.nlm.nih.gov/IEB/ToolBox/CPP_DOC/lxr/source/src/app/dustmask/
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/dustmasker
type: unrestricted
categories:
  - Sequence Analysis
