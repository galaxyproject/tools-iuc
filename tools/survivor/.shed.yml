name: survivor
owner: iuc
description: Merge structural variant calls from several callers or samples with SURVIVOR
homepage_url: https://github.com/fritzsedlazeck/SURVIVOR
long_description: |
  SURVIVOR is a toolset for simulating, comparing and filtering structural
  variants (SVs). This repository wraps SURVIVOR merge, which combines SV calls
  from several VCF files into one VCF, either as a consensus of several SV
  callers run on the same sample or as a multi-sample callset. Calls are merged
  when their breakpoints lie within a maximum distance and, optionally, when
  they share SV type and strands, and are kept when enough inputs support them.
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/survivor
type: unrestricted
categories:
  - Variant Analysis
