description: GO-like enrichment analysis of anatomical terms and cell types mapped to genes by expression patterns using TopAnat
homepage_url: https://bioconductor.org/packages/release/bioc/html/BgeeDB.html
long_description: |
  TopAnat performs a GO-like enrichment analysis of anatomical terms and cell types
  for a given list of genes. It uses active expression calls from the Bgee database
  to map genes to the anatomical entities and cell types where they are expressed,
  then applies a topGO-based enrichment test to identify anatomical entities
  over-represented in the foreground gene set compared to a background (universe).

  This analysis is conceptually similar to a Gene Ontology enrichment analysis,
  but uses anatomy ontology terms and cell type terms instead of
  GO terms, with gene annotations derived from curated expression data.
name: topanat
owner: iuc
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/topanat
