owner: iuc
description: "HyphAeon: Deep-Time Phylogenetic Foundation Model for Evolutionary Genomics"
homepage_url: https://github.com/veg/HyphAeon
long_description: |
  HyphAeon is a phylogenetic foundation model for neural inference of
  episodic positive selection (MEME), directional phenotype-genotype
  association (PhyloWAS), in silico deep mutational scanning (Digital DMS),
  and multi-scale epistatic sector mining (ESSM). Model weights are fetched
  from the Hugging Face Hub on first use.
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/hyphaeon
type: unrestricted
categories:
  - Phylogenetics
auto_tool_repositories:
  name_template: "{{ tool_id }}"
  description_template: "Wrapper for the HyphAeon subcommand: {{ tool_name }}"
