name: skesa
owner: iuc
description: SKESA de novo assembler for microbial Illumina reads
long_description: |
  SKESA (Strategic K-mer Extension for Scrupulous Assemblies) is NCBI's de novo
  sequence read assembler for microbial genomes sequenced with Illumina. It builds
  contigs by extending k-mers over a range of k-mer lengths, preferring to stop at
  repeats and ambiguous branches rather than risk a misassembly, which gives
  conservative, accurate assemblies quickly.
categories:
  - Assembly
homepage_url: https://github.com/ncbi/SKESA
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/skesa
type: unrestricted
