name: ucsc_bigwigaverageoverbed
owner: iuc
description: Compute average score of a bigWig over each BED region
long_description: bigWigAverageOverBed summarises the signal of a bigWig file over each region of a BED file and reports size, covered bases, sum and mean per region. BED12 regions are summarised over their blocks only.
homepage_url: https://genome.ucsc.edu/goldenPath/help/bigWig.html
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/ucsc_tools/ucsc_bigwigaverageoverbed
type: unrestricted
categories:
  - Sequence Analysis
