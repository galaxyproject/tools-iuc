name: perseus
owner: iuc
description: "Perseus refines Kraken2 taxonomic classifications of long reads and contigs"
long_description: |
  Perseus is a post-processing framework for refining Kraken2 taxonomic
  classifications, with a focus on long-read metagenomics (PacBio HiFi, ONT). While
  Kraken2's exact k-mer matching enables fast and sensitive classification, it can
  produce overconfident fine-rank calls when evidence is sparse, conserved, or
  partially novel. Perseus addresses this limitation by distinguishing trustworthy
  from spurious taxonomic predictions using structured k-mer evidence already present
  in the Kraken2 output.

  This suite provides three tools that mirror the Perseus command line workflow:
  setting up the ETE3 taxonomy database, extracting lineage-aware features from a
  Kraken2 output file, and filtering the Kraken2 output using the extracted features.
homepage_url: https://github.com/matnguyen/Perseus
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/perseus
type: unrestricted
categories:
  - Metagenomics
  - Sequence Analysis
auto_tool_repositories:
  name_template: "{{ tool_id }}"
  description_template: "{{ tool_name }}"
