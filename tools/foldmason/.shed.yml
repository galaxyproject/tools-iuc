categories:
- Sequence Analysis
- Proteomics
description: Multiple protein structure alignment with FoldMason and ProstT5
long_description: |
  FoldMason aligns protein structures using amino acid and 3Di information,
  predicts 3Di tokens from sequences with installed ProstT5 GGUF weights,
  and scores existing multiple alignments using structural LDDT.
name: foldmason
owner: iuc
homepage_url: https://github.com/steineggerlab/foldmason
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/foldmason
type: unrestricted
auto_tool_repositories:
  name_template: '{{ tool_id }}'
  description_template: 'Wrapper for FoldMason: {{ tool_name }}.'
suite:
  name: suite_foldmason
  description: Multiple protein structure alignment and scoring with FoldMason
  type: repository_suite_definition
