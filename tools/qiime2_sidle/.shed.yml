name: qiime2_sidle
owner: iuc
description: Native QIIME 2 SIDLE multiregion reconstruction tools
homepage_url: https://github.com/jwdebelius/q2-sidle
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/qiime2_sidle
type: unrestricted
categories:
  - Metagenomics
long_description: |
  Seven native wrappers for the SIDLE runtime pinned by nf-core/ampliseq 2.11.0.
  Prepare regional reference kmers, align ASVs, reconstruct database/counts/taxonomy,
  trim DADA2 tables and reconstruct representative fragments. Uses the pinned
  nf-core pipesidle container and requires QIIME artifact archive version 5.
