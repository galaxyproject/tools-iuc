categories:
- Sequence Analysis
- Genome annotation
description: Project ranges through pairwise alignments as an implicit pangenome graph
long_description: |
  impg (implicit pangenome graph) treats all-vs-all pairwise alignments as an
  implicit pangenome graph and projects target ranges through the alignment
  network to extract homologous sequences. It outputs BED/BEDPE/PAF/FASTA/GFA
  ready to feed FASTA extraction, multiple sequence alignment, or a graph
  builder like pggb or minigraph-cactus.

  This suite wraps the core alignment-projection subcommands of impg:
  query, partition, refine, similarity, and stats.
homepage_url: https://github.com/pangenome/impg
name: impg
owner: iuc
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/impg
type: unrestricted
auto_tool_repositories:
  name_template: "{{ tool_id }}"
  description_template: "Wrapper for impg application: {{ tool_name }}."
suite:
  name: suite_impg
  description: A suite of Galaxy tools for the impg implicit pangenome graph toolkit.
  type: repository_suite_definition
