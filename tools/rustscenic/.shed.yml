name: rustscenic
owner: iuc
description: Infer transcription factor to target networks from single-cell RNA expression with RustScenic
long_description: |
  Wraps the released RustScenic GRN command for prepared single-cell RNA
  expression in AnnData, TSV or CSV format. Produces a TF-target importance
  table and the upstream JSON fitting metadata. Uses RustScenic's histogram
  gradient-boosting implementation; equivalent output to pySCENIC or arboreto
  is not claimed. This wrapper does not run motif filtering or a full SCENIC
  workflow.
homepage_url: https://github.com/Ekin-Kahraman/rustscenic
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/rustscenic
type: unrestricted
categories:
  - Transcriptomics
  - RNA
