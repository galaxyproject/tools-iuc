name: fair_bioheaders
owner: iuc
categories:
  - Sequence Analysis
  - Convert Formats
description: Add, verify, remove and convert FAIR-bioHeaders metadata headers in FASTA, GFA and GFF3
long_description: |
  FAIR-bioHeaders (FHR) records the provenance of a genome assembly, protein
  set or annotation in a header at the top of the FASTA, GFA or GFF3 file
  itself, with a checksum of the data. These tools from the fair-bioheaders
  toolkit add a header to a file (combine), check its metadata and checksum
  (verify), remove it (strip) and convert the metadata between YAML, JSON,
  JSON-LD and HTML microdata (convert).
homepage_url: https://github.com/FAIR-bioHeaders/FAIR-bioHeaders-Tools
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/fair_bioheaders
type: unrestricted
