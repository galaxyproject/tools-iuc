name: dupradar
owner: iuc
description: Duplication rate quality control for RNA-seq data
long_description: |
  dupRadar relates the PCR duplication rate of each gene to its expression level, which separates
  the duplication expected from highly expressed genes from technical duplication caused by low
  library complexity or over-amplification. It reports a per-gene duplication matrix, density,
  boxplot and histogram plots, and the intercept and slope of a fitted logistic model.
categories:
- Transcriptomics
- RNA
- Sequence Analysis
homepage_url: https://bioconductor.org/packages/dupRadar
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/dupradar
type: unrestricted
