name: tiddit
owner: iuc
description: TIDDIT structural variant caller and coverage tool for short-read WGS data
long_description: |
  TIDDIT identifies chromosomal rearrangements in paired-end or mate-pair
  whole-genome sequencing data. It combines discordant read pairs, split reads
  and read depth to call deletions, duplications, inversions, insertions and
  translocations, and can optionally refine breakpoints by local assembly of
  soft-clipped reads. It also computes binned coverage tracks from BAM files.
homepage_url: https://github.com/SciLifeLab/TIDDIT
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/tiddit
type: unrestricted
categories:
- Variant Analysis
auto_tool_repositories:
  name_template: "{{ tool_id }}"
  description_template: "Wrapper for TIDDIT: {{ tool_name }}."
suite:
  name: "suite_tiddit"
  description: "TIDDIT structural variant calling and coverage tools."
  type: repository_suite_definition
