owner: iuc
description: "TRACE-5.0: Dynamic Molecular Surveillance of Viral Transmission Networks"
homepage_url: https://github.com/veg/HyphAeon
long_description: |
  TRACE-5.0 deconvolves viral transmission networks from dated nucleotide
  alignments. It screens candidate transmission dyads with internal TN93
  distances, calibrates edges under DANNO with physical clock-adequacy
  testing and Bayesian FDR control, resolves STEVE communities, and infers
  CHIN macro-scale epidemiological scaling.
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/trace50
type: unrestricted
categories:
  - Phylogenetics
auto_tool_repositories:
  name_template: "{{ tool_id }}"
  description_template: "Wrapper for the TRACE-5.0 transmission-network scanner: {{ tool_name }}"
suite:
  name: suite_hyphaeon
  description: HyphAeon suite of tools for deep-time phylogenetic foundation-model analyses and molecular clock surveillance
  type: repository_suite_definition
