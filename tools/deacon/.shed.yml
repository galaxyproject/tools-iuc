name: deacon
owner: iuc
description: Filter DNA sequences in FASTA/Q files and streams using accelerated minimizer comparison
homepage_url: https://github.com/bede/deacon
long_description: |
  Filter sequences using accelerated minimizer comparison with query sequence(s), 
  emitting either matching sequences (search mode), or sequences without matches (deplete mode). 
  Sequences match when they share enough distinct minimizers with the indexed query to exceed chosen 
  absolute and relative thresholds.
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/deacon
type: unrestricted
categories: 
- Metagenomics
auto_tool_repositories:
  name_template: "{{ tool_id }}"
  description_template: "Wrapper for deacon tool: {{ tool_name }}."
suite:
  name: "suite_deacon"
  description: "A suite of tools that brings the deacon project into Galaxy."
  long_description: |
    Filter DNA sequences in FASTA/Q files and streams using accelerated minimizer comparison
