name: itbins
owner: iuc
description: Automated curation of metagenome-assembled genomes using GC content, coverage and taxonomy
long_description: |
  itBins is a fast command line tool for the automated curation of metagenome-assembled
  genomes (MAGs). It refines an existing binning using the GC content, the coverage and the
  taxonomic affiliation of the contigs of each bin, removes contamination and low quality
  bins, and estimates the success of the binning. It is the automated counterpart of the
  interactive bin curation tool uBin and uses the same input files.
homepage_url: https://github.com/ProbstLab/itBins
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/itbins
type: unrestricted
categories:
- Metagenomics
auto_tool_repositories:
  name_template: "{{ tool_id }}"
  description_template: "Wrapper for {{ tool_name }}."
suite:
  name: "suite_itbins"
  description: "A suite of Galaxy tools for itBins."
  type: repository_suite_definition
