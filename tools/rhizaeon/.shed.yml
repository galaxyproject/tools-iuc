owner: iuc
description: "RhizAeon: Recombination Scanner"
homepage_url: https://github.com/veg/HyphAeon
long_description: |
  RhizAeon is the recombination-scanner component of the Aeon package
  family — a Rust engine that projects alignment columns onto a
  phylo-attention force field, screens candidate recombinant taxa, and
  verifies tracts under Fisher/Poisson significance floors, with JSON and
  standalone HTML dashboard output.
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/rhizaeon
type: unrestricted
categories:
  - Phylogenetics
auto_tool_repositories:
  name_template: "{{ tool_id }}"
  description_template: "Wrapper for the RhizAeon recombination scanner: {{ tool_name }}"
suite:
  name: suite_hyphaeon
  description: HyphAeon suite of tools for deep-time phylogenetic foundation-model analyses and molecular clock surveillance
  type: repository_suite_definition
