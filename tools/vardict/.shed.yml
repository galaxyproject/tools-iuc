name: vardict_java
owner: iuc
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/vardict
homepage_url: "https://github.com/joachimwolff/VarDictJava"
description: "VarDict - calls SNVs and indels for tumour-normal pairs"
long_description: |
  The original Perl VarDict is a sensitive variant caller for both single and paired sample variant calling from BAM files.
  VarDict implements several novel features such as amplicon bias aware variant calling from targeted sequencing experiments,
  rescue of long indels by realigning bwa soft clipped reads and better scalability than many other Java based variant callers.
  The Java port is around 10x faster than the original Perl implementation.
categories:
- "Variant Analysis"
auto_tool_repositories:
  name_template: "{{ tool_id }}"
  description_template: "Wrapper for {{ tool_name }}"
