name: comebin_llmopt
owner: iuc
description: Faster COMEBin binning of metagenomic contigs (contrastive multi-view representation learning)
homepage_url: https://github.com/paulzierep/COMEBin-LLMopt
long_description: |
  COMEBin-LLMopt is a modified, faster version of COMEBin 1.1.0. COMEBin uses data
  augmentation to generate multiple views of each contig and learns embeddings of
  coverage and k-mer features by contrastive learning before clustering them into bins.
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/comebin_llmopt
type: unrestricted
categories:
- Metagenomics
