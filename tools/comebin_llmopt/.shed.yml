name: comebin_llmopt
owner: iuc
description: An LLM-optimized, faster and more robust COMEBin with CheckM2 bin selection for improved binning of metagenomic contigs
homepage_url: https://github.com/paulzierep/COMEBin-LLMopt
long_description: |
  COMEBin-LLMopt bins metagenomic contigs. It started from COMEBin 1.1.0 and was changed
  step by step with the help of an AI coding agent, keeping only changes that held up in
  benchmarks. It uses the same contrastive learning on k-mer and coverage features as
  COMEBin, but picks the final bins with CheckM2 from all clusterings, chooses the loss
  temperature from the assembly, runs about 2.7 times faster on CPUs and adds options
  such as a minimum contig length and a random seed.
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/comebin_llmopt
type: unrestricted
categories:
- Metagenomics
