name: mic_50_90
owner: iuc
categories:
  - Statistics
description: Bounds MIC distributions from incomplete susceptibility reports
long_description: |
  MIC-50-90 is a Python package for bounding MIC distributions from incomplete susceptibility
  reports. From MIC50, MIC90, observed extremes and exact or rounded counts it gives the smallest
  and largest count the report allows in every category and range, with optional population bounds
  under stated sampling assumptions. A laboratory holding the complete counts can choose the counts
  to publish so that readers can check stated answers, and readers can check such a report.
homepage_url: https://github.com/maciejkochanowski/mic-50-90
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/mic_50_90
type: unrestricted
auto_tool_repositories:
  name_template: "{{ tool_id }}"
  description_template: "{{ tool_name }}, a tool of the MIC-50-90 suite"
suite:
  name: suite_mic_50_90
  description: Tools that bound MIC distributions from incomplete susceptibility reports
  long_description: |
    MIC-50-90 is a Python package for bounding MIC distributions from incomplete susceptibility
    reports. The suite holds three tools: one gives the smallest and largest count a report allows
    in every category and range, one chooses the counts a laboratory should publish so that readers
    can check stated answers, and one checks a received report.
