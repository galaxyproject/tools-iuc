name: mic_50_90
owner: iuc
categories:
  - Statistics
description: Bounds MIC distributions from incomplete susceptibility reports
long_description: |
  MIC-50-90 is a Python package for bounding MIC distributions from incomplete susceptibility
  reports. From MIC50, MIC90, observed extremes and exact or rounded counts it gives the smallest
  and largest count the report allows in every category and range, with optional population bounds
  under stated sampling assumptions. A laboratory holding the complete counts can choose the counts
  to publish so that readers can check stated answers, and readers can check such a report.
homepage_url: https://github.com/maciejkochanowski/mic-50-90
