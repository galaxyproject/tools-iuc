name: fastan
owner: iuc
description: FasTAN finds tandem-repeat arrays and reports them as BED6
long_description: |
  FasTAN (Gene Myers) finds tandem-repeat arrays in a FASTA file. The tool
  runs FAtoGDB, FasTAN and ONEview and writes one BED6 line for each array.
  The name column holds the repeat unit length. The score column holds
  1000 - 10 * divergence.
homepage_url: https://github.com/thegenemyers/FASTAN
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/fastan
type: unrestricted
categories:
  - Sequence Analysis
