name: scdblfinder
owner: iuc
description: "scDblFinder - detect doublets in single-cell RNA-seq data"
homepage_url: https://bioconductor.org/packages/scDblFinder
long_description: |
    scDblFinder identifies doublets in single-cell sequencing data. It creates artificial doublets
    from the real cells and trains a gradient-boosted classifier to distinguish them from real cells,
    giving each barcode a doublet score and a singlet/doublet call.
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/scdblfinder
type: unrestricted
categories:
  - Single Cell
  - Transcriptomics
