name: binspreader
owner: iuc
description: Refine and propagate a metagenomic binning using the assembly graph
long_description: |
  BinSPreader refines and propagates an existing metagenomic binning (a set of MAGs)
  using the connectivity of the assembly graph and, optionally, of paired-end or Hi-C
  read libraries. It corrects binning errors, propagates the binning from longer contigs
  to shorter contigs connected to them, and infers contigs belonging to several MAGs.
homepage_url: https://github.com/ablab/spades/tree/main/src/projects/binspreader
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/binspreader
type: unrestricted
categories:
- Metagenomics
auto_tool_repositories:
  name_template: "{{ tool_id }}"
  description_template: "Wrapper for {{ tool_name }}."
suite:
  name: "suite_binspreader"
  description: "A suite of Galaxy tools for BinSPreader."
  type: repository_suite_definition
