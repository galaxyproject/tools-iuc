name: transvar
owner: iuc
description: "TransVar: a multilevel variant annotator for precision genomics"
homepage_url: https://bioinformatics.mdanderson.org/public-software/transvar/
long_description: |
    TransVar is a multiway annotator for genetic elements and genetic
    variations. It maps a variant between the genomic, cDNA and protein
    levels and reports, for every matching transcript, the affected region
    and the functional consequence, using RefSeq, CCDS, Ensembl, GENCODE and
    UCSC transcript annotations.

    The transcript annotation databases are provided through the
    transvar_annotations data table, which is populated by the
    data_manager_transvar_annotations data manager.
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/transvar
type: unrestricted
categories:
- Variant Analysis
