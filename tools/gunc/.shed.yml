name: gunc
owner: iuc
description: Detect chimerism and contamination in prokaryotic genomes
long_description: |
  GUNC (Genome UNClutterer) detects chimerism and contamination in prokaryotic
  genomes such as metagenome-assembled genomes, based on the taxonomic
  homogeneity of their genes.
homepage_url: https://github.com/grp-bork/gunc
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/gunc
categories:
  - Metagenomics
type: unrestricted
