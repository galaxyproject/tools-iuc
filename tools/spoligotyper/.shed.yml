name: spoligotyper
owner: iuc
description: In silico spoligotyping, species and lineage of the Mycobacterium tuberculosis complex
homepage_url: https://github.com/duceppemo/spoligotyper
long_description: |
  spoligotyper finds the 43 spacers of the direct repeat (DR) locus of Mycobacterium tuberculosis complex samples
  in sequencing reads (fastq) or assemblies (fasta), and reports the spoligotype as binary, octal and hexadecimal
  codes and as an SB number from the Mbovis.org database. It also identifies the species from regions of
  difference (RD1, RD4, RD7, RD9, RD12) and the lineage from a 62-SNP barcode, flags mixed or contaminated samples, and writes
  a PDF report for quality assurance.
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/spoligotyper
type: unrestricted
categories:
- Sequence Analysis
