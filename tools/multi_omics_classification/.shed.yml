description: A Machine Learning Framework for Benchmarking, Feature Selection, and Hyperparameter Optimization of Machine Learning Models for Multiomics Data
homepage_url: https://github.com/usegalaxy-eu/MultiOmicsClassification
long_description: |
The multi-omics-classification tool is designed for the analysis of small, high-dimensional biological datasets. It allows users to systematically compare different feature sets, sampling strategies, and classification models, with optional grid-search-based hyperparameter tuning. A range of performance metrics is provided to support robust model evaluation and comparison, particularly in settings where the number of samples is limited relative to the number of features.
