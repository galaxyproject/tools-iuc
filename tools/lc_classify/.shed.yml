name: lc_classify
owner: iuc
description: Classify low-complexity intervals by repeat unit and purity (BED6)
long_description: |
  This tool classifies low-complexity intervals, for example from dustmasker,
  tantan or windowmasker, by their repeat unit. The BED6 name is polyA, (AT)n,
  (AAT)n and so on for periods 1 to 6, or lc for anything else. The score is
  the purity x 1000. The tool reads the FASTA one record at a time, so memory
  use stays low.
homepage_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/lc_classify
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/lc_classify
type: unrestricted
categories:
