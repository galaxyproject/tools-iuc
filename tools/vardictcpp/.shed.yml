name: vardictcpp
owner: iuc
categories:
  - Variant Analysis
description: Fast, memory-lean C++ reimplementation of the VarDict variant caller
long_description: |
  vardictcpp is a C++17/htslib reimplementation of VarDict (AstraZeneca-NGS VarDictJava 1.8.3).
  It produces variant calls byte-for-byte identical to VarDict-Java at a fraction of the runtime
  and memory, in single-sample and paired (tumor/normal) modes, and writes VCF natively in C++
  (no Java, R or Perl downstream).
homepage_url: https://github.com/MHH-Bioinformatics-Hematology/vardictcpp
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/vardictcpp
type: unrestricted
