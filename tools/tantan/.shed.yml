name: tantan
owner: iuc
description: Find and mask simple repeats in DNA sequences with tantan
long_description: |
  tantan finds simple repeats in DNA sequences with a probabilistic model.
  Simple repeats include tandem repeats and low-complexity regions. The tool
  writes a BED file of repeat intervals or a FASTA file with the repeats
  soft-masked or hard-masked. The masks help to prevent false homology
  predictions in sequence searches.
homepage_url: https://gitlab.com/mcfrith/tantan
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/tantan
type: unrestricted
categories:
  - Sequence Analysis
