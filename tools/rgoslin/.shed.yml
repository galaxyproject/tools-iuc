name: rgoslin
owner: iuc
description: Parse and normalize lipid names using Goslin.
long_description:  rgoslin parses lipid shorthand names from multiple nomenclature dialects and normalizes them using the Grammar of Succinct Lipid Nomenclature (Goslin). It provides lipid class annotations, structural information, sum formulas, and monoisotopic masses. The Galaxy tool generates a summary annotation table and optionally a full annotation table.
homepage_url: https://github.com/lifs-tools/rgoslin
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/rgoslin
type: unrestricted
categories:
- Metabolomics
