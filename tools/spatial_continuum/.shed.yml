long_description: |
    The Spatial-Genomic Oncology Continuum suite provides clinical decision support tools for resected EGFR-mutant 
    non-small cell lung cancer (NSCLC) under adjuvant osimertinib (ADAURA setting). Includes the Bedside Composite 
    Resistance Index (CRI) calculator and reaction-diffusion mathematical sanctuary audit.
