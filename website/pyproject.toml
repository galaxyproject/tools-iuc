[project]
name = "iuc-website-pipeline"
version = "0.1.0"
description = "Data-extraction pipeline for the IUC website (reuses Galaxy's source_store + tool_util)"
requires-python = ">=3.11"
# Galaxy packages are installed directly from the upstream git repo's
# packages/ subdirectories. source_store lives in galaxy-app; the parser,
# biotools, and ontology_data modules live in galaxy-tool-util.
# The [edam] extra pulls in edam-ontology for EDAM expansion.
dependencies = [
    "pyyaml>=6.0",
    "bioblend>=1.4.0",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "packaging>=24.0",
    "gitpython>=3.1.0",
    "docutils>=0.20",
    "markdown>=3.5",
    "galaxy-tool-util[edam] @ git+https://github.com/galaxyproject/galaxy.git@dev#subdirectory=packages/tool_util",
    "galaxy-app @ git+https://github.com/galaxyproject/galaxy.git@dev#subdirectory=packages/app",
]

[project.scripts]
iuc-extract-tools = "pipeline.extract_tools:main"
iuc-extract-toolshed = "pipeline.extract_toolshed:main"
iuc-extract-stats = "pipeline.extract_stats:main"
iuc-extract-people = "pipeline.extract_people:main"
iuc-extract-releases = "pipeline.extract_releases:main"
iuc-extract-tool-availability = "pipeline.extract_tool_availability:main"
iuc-build-tool-conf = "pipeline.build_tool_conf:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["pipeline/stats"]  # vendored from PR #8152, kept verbatim

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
