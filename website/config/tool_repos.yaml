# Galaxy tool repositories — curated list for the IUC website front page.
# Each entry has: name, url (ToolShed or GitHub), description, and optional owner org.
# To add a new repository, append an entry below. The front page renders them
# in the order listed.
#
# Fields:
#   name:         Display name
#   url:          Link to ToolShed, GitHub, or other landing page
#   description:  Short one-line description
#   owner:        Organisation or team (optional)

- name: Galaxy Tools Devteam
  url: https://github.com/galaxyproject/tools-devteam
  description: Core Galaxy development team tools.
  owner: Galaxy Project

- name: bgruening tools
  url: https://github.com/bgruening/galaxytools
  description: Bioinformatics and chemistry tools, especially for epigenetics and cheminformatics.
  owner: Björn Grüning

- name: ARTbio tools
  url: https://github.com/ARTbio/tools-artbio
  description: RNA-seq and transcriptomics tools for Galaxy.
  owner: ARTbio

- name: GenOuest tools
  url: https://github.com/genouest/galaxy-tools
  description: Bioinformatics tools from the GenOuest platform.
  owner: GenOuest

- name: Earlham Institute tools
  url: https://github.com/EarlhamInst/earlham-galaxytools
  description: Metabolomics and proteomics tools from Earlham Institute.
  owner: Earlham Institute

- name: Galaxy-P (Proteomics)
  url: https://github.com/galaxyproteomics/tools-galaxyp
  description: Proteomics tools for Galaxy.
  owner: Galaxy Proteomics

- name: Galaxy Metabolomics
  url: https://github.com/workflow4metabolomics/tools-metabolomics
  description: Metabolomics tools for Galaxy, maintained by Workflow4Metabolomics.
  owner: Workflow4Metabolomics

- name: Computational Chemistry
  url: https://github.com/galaxycomputationalchemistry/galaxy-tools-compchem
  description: Computational chemistry and cheminformatics tools for Galaxy.
  owner: Galaxy Computational Chemistry

- name: Galaxy Ecology
  url: https://github.com/galaxyecology/tools-ecology
  description: Ecology and environmental science tools for Galaxy.
  owner: Galaxy Ecology

- name: Earth Data
  url: https://github.com/earth-data-community/galaxy-tools
  description: Earth science and climate tools for Galaxy.
  owner: Earth Data Community

