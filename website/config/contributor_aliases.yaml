# Curated aliases for contributors who changed public GitHub handles.
# Maps secondary public identity signals to the canonical GitHub handle, which
# should match a GTN CONTRIBUTORS.yaml key whenever possible.
#
# This is the ONLY place where identities are manually merged. Every entry
# here must be verified by a human; no fuzzy matching and no private email
# identity mapping.
#
# Format:
#   <canonical-github-handle>:
#     github: [old-handle-1, old-handle-2, ...]
#     name: [old-name-slug-or-display-name, ...]
#
# To resolve a duplicate contributor page, add public identity metadata instead
# of using an email address:
#
# 1. Preferred: add/fix the contributor's GitHub handle in the relevant
#    `<creator>` XML entry, for example `url="https://github.com/apetkau"`.
# 2. Good: add/fix the contributor's ORCID in the relevant `<creator>` XML
#    entry. Exact ORCID matches merge automatically.
# 3. Good: add/update the contributor in GTN `CONTRIBUTORS.yaml` with a public
#    GitHub handle and/or ORCID. The website joins GTN identities by handle,
#    ORCID, and exact GTN name.
# 4. If a maintainer personally verifies that a generated name slug belongs to
#    the same person, add it under `name:` below. Prefer upstream GitHub/ORCID
#    metadata when possible.
# 5. Only for verified GitHub handle changes: add the old public handle under
#    `github:` below.
#
# Do not add private or normal email addresses here. Email is read from git
# history for commit metadata, and GitHub noreply addresses are used only to
# extract their public GitHub handle, but email is not an identity key.
#
# Current generated data has 20 duplicate normalized-name clusters that cannot
# be merged by the public identifiers available today. To resolve them, add
# GitHub/ORCID/GTN metadata for the non-GitHub record, or add a public handle
# alias here if the duplicate is due to a GitHub handle change:
#
# - Aaron Petkau: `aaron-petkau` should be linked to `apetkau`.
# - Adrian Diaz / Adrián Díaz: `adri-n-diaz` needs the same ORCID/GitHub as `adrian-diaz`.
# - Andrea Furlani: `andrea-furlani` should be linked to `AndreaFurlani`.
# - Boris Depoortere: `boris-depoortere` should be linked to `B0r1sD`.
# - Christophe Antoniewski: `christophe-antoniewski` should be linked to `drosofff`.
# - Danielle Callan: `danielle-callan` should be linked to `d-callan`.
# - Dennis Dollée: `dennis-doll-e` should be linked to `WhoisDonlee`.
# - Eric Marinier: `eric-marinier` should be linked to `emarinier`.
# - Fabio Cumbo: `fabio-cumbo` should be linked to `cumbof`.
# - Harrison Deng: `harrison-deng` should be linked to `RealYHD`.
# - Jacob L. Steenwyk: `jacob-l-steenwyk` should be linked to `JLSteenwyk`.
# - Lance Parsons: `lance-parsons` should be linked to `lparsons`.
# - Lieven Sterck: `lieven-sterck` should be linked to `lsterck`.
# - Mara Besemer: `mara-besemer` should be linked to `MaraBesemer`.
# - Oleksiy Kozlov: `oleksiy-kozlov` should be linked to `amkozlov`.
# - Rayane Elmedjadji: `rayane-elmedjadji` should be linked to `elmedjadjirayane`.
