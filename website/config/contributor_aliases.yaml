# Curated aliases for contributors who changed public GitHub handles.
# Maps secondary public identity signals to the canonical GitHub handle, which
# should match a GTN CONTRIBUTORS.yaml key whenever possible.
#
# This is the ONLY place where identities are manually merged. Every entry
# here must be verified by a human; no fuzzy matching and no private email
# identity mapping.
#
# Format:
#   <canonical-github-handle>:
#     github: [old-handle-1, old-handle-2, ...]
#     name: [old-name-slug-or-display-name, ...]
#
# To resolve a duplicate contributor page, add public identity metadata instead
# of using an email address:
#
# 1. Preferred: add/fix the contributor's GitHub handle in the relevant
#    `<creator>` XML entry, for example `url="https://github.com/apetkau"`.
# 2. Good: add/fix the contributor's ORCID in the relevant `<creator>` XML
#    entry. Exact ORCID matches merge automatically.
# 3. Good: add/update the contributor in GTN `CONTRIBUTORS.yaml` with a public
#    GitHub handle and/or ORCID. The website joins GTN identities by handle,
#    ORCID, and exact GTN name.
# 4. If a maintainer personally verifies that a generated name slug belongs to
#    the same person, add it under `name:` below. Prefer upstream GitHub/ORCID
#    metadata when possible.
# 5. Only for verified GitHub handle changes: add the old public handle under
#    `github:` below.
#
# Do not add private or normal email addresses here. Git commit emails are read
# transiently for author aggregation, and GitHub noreply addresses are used only
# to extract their public GitHub handle. Email is not an identity key and is not
# written to the generated contributor output.
#
# Current generated data should not have duplicate normalized-name clusters.
# If new clusters appear, resolve them by adding GitHub/ORCID/GTN metadata for
# the non-GitHub record, or add a public handle alias here if the duplicate is
# due to a GitHub handle change.

