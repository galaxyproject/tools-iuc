# Galaxy instances for the "Run on" matrix on tool pages.
# The deep-link format is: https://<server>/?tool_id=<percent-encoded GUID>
# where GUID = toolshed.g2.bx.psu.edu/repos/<owner>/<repo>/<tool_id>/<version>
servers:
  - name: useGalaxy.org
    url: https://usegalaxy.org
  - name: useGalaxy.eu
    url: https://usegalaxy.eu
  - name: useGalaxy.fr
    url: https://usegalaxy.fr
  - name: useGalaxy.be
    url: https://usegalaxy.be
  - name: useGalaxy.it
    url: https://usegalaxy.it
  - name: useGalaxy.ca
    url: https://usegalaxy.ca
  - name: useGalaxy.cz
    url: https://usegalaxy.cz
  - name: useGalaxy.org.au
    url: https://usegalaxy.org.au

toolshed:
  base: https://toolshed.g2.bx.psu.edu
  host: toolshed.g2.bx.psu.edu
  view: /view/

iuc:
  repo: galaxyproject/tools-iuc
  issues: https://github.com/galaxyproject/tools-iuc/issues/new
  guides: https://galaxy-iuc-standards.readthedocs.io/

ecosystem:
  galaxy_hub: https://galaxyproject.org/
  galaxy_hub_iuc: https://galaxyproject.org/iuc/
  galaxy_tools: https://galaxyproject.org/tools/
  planemo: https://planemo.readthedocs.io/
  galaxy_language_server: https://github.com/galaxyproject/galaxy-language-server
  gtn_tool_training: https://training.galaxyproject.org/training-material/topics/dev/tutorials/tool-from-scratch/tutorial.html
  tool_dev_sig: https://galaxyproject.org/community/sig/tool-developers/
  iwc: https://github.com/galaxyproject/iwc
  chat: https://matrix.to/#/#galaxy-iuc_iuc:gitter.im
