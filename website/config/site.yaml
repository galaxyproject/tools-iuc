# Galaxy instances for the "Run on" matrix on tool pages.
# The deep-link format is: https://<server>/?tool_id=<percent-encoded GUID>
# where GUID = toolshed.g2.bx.psu.edu/repos/<owner>/<repo>/<tool_id>/<version>
servers:
  - name: useGalaxy.org
    url: https://usegalaxy.org
  - name: useGalaxy.eu
    url: https://usegalaxy.eu
  - name: useGalaxy.fr
    url: https://usegalaxy.fr
  - name: useGalaxy.be
    url: https://usegalaxy.be
  - name: useGalaxy.it
    url: https://usegalaxy.it
  - name: useGalaxy.org.au
    url: https://usegalaxy.org.au

toolshed:
  base: https://toolshed.g2.bx.psu.edu
  host: toolshed.g2.bx.psu.edu
  view: /view/

iuc:
  repo: galaxyproject/tools-iuc
  issues: https://github.com/galaxyproject/tools-iuc/issues/new
  guides: https://galaxy-iuc-standards.readthedocs.io/
